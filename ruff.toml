line-length = 100

# Pydantic field validators must raise ValueError (not TypeError) so FastAPI
# turns them into 422 envelope details. DOB parsing is a calendar date, not a tz.
[lint]
select = ["E", "F", "I", "UP"]

[lint.per-file-ignores]
"app/core/validators.py" = ["TRY004"]
# Spoken prompt lines are written for the LLM, not wrapped to 100 cols.
"app/llm/prompt.py" = ["E501"]
